<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Jira issue</title>
    <!-- The plain reader: used when the bundled reviewer has no annotate (cc-cockpit before
      0.8.0). Read-only text and three buttons; the host does the rest. -->
    <script src="/__sdk/panel.js"></script>
    <script src="issue.js" defer></script>
    <style>
      body { margin: 0; padding: 12px 16px; font: 13px/1.5 system-ui, sans-serif; background: var(--cc-bg); color: var(--cc-fg); }
      header { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; position: sticky; top: 0; background: var(--cc-bg); padding: 4px 0; }
      header .grow { flex: 1; }
      button { font: inherit; color: inherit; background: var(--cc-bg-menu); border: 1px solid var(--cc-border); border-radius: 4px; padding: 3px 8px; cursor: pointer; }
      button:hover { border-color: var(--cc-border-strong); }
      button:focus-visible { outline: 2px solid var(--cc-focus); outline-offset: 1px; }
      button.primary { background: var(--cc-accent); color: var(--cc-accent-fg); border-color: var(--cc-accent); }
      .muted { color: var(--cc-fg-muted); }
      pre { white-space: pre-wrap; overflow-wrap: anywhere; font: 12.5px/1.5 ui-monospace, monospace; background: var(--cc-surface-1); padding: 10px 12px; border-radius: 6px; margin: 0; }
    </style>
  </head>
  <body>
    <header>
      <span class="muted grow">Notes on the text need cc-cockpit 0.8.0 (the reviewer's annotate).</span>
      <button id="discuss" type="button" class="primary" title="Send the issue to the Claude tab you are looking at">Discuss</button>
      <button id="new" type="button" title="Open a new Claude tab about this issue">New session</button>
      <button id="browser" type="button" title="Open in the browser">↗</button>
    </header>
    <pre id="text">Loading…</pre>
  </body>
</html>
