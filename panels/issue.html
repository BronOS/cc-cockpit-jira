<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Jira issue</title>
    <!-- The issue window (0.9.0, layout A): the issue on the left (the overlay kit's renderer: an inert parse,
      an allow-list walk, fresh elements; never innerHTML), the note for Claude and the notes under it, and a side
      column with Ask (core's chat) and Reply (the host keeps the form). The host (dist/host.js) greets each copy
      with the access the app gave it; a read guest's copy has no side column. The kit is vendored and pinned
      (vendor/cc-kit, test/kit-pin.test.js). The CSP runs no inline script: the logic is in replylogic.js and
      issue.js. -->
    <link rel="stylesheet" href="../vendor/cc-kit/dist/cc-kit.css" />
    <script src="/__sdk/panel.js"></script>
    <script src="../vendor/cc-kit/dist/cc-kit.js"></script>
    <script src="replylogic.js" defer></script>
    <script src="issue.js" defer></script>
    <style>
      html, body { height: 100%; }
      body { margin: 0; font: 13px/1.55 system-ui, sans-serif; background: var(--cc-bg); color: var(--cc-fg); }
      #app { display: flex; height: 100%; }
      #main { flex: 1; min-width: 0; overflow-y: auto; padding: 8px 16px 16px; }
      #side { width: 340px; flex: none; border-left: 1px solid var(--cc-border); display: flex; flex-direction: column; min-height: 0; }
      #side[hidden] { display: none; }
      #side .cc-kit-tabs { flex: 1; min-height: 0; display: flex; flex-direction: column; }
      #side .cc-kit-tabbody { flex: 1; min-height: 0; overflow-y: auto; padding: 8px 12px; }
      @media (max-width: 700px) { #app { flex-direction: column; } #side { width: auto; border-left: none; border-top: 1px solid var(--cc-border); } }
      .muted { color: var(--cc-fg-muted); }
      button { font: inherit; color: inherit; background: var(--cc-bg-menu); border: 1px solid var(--cc-border); border-radius: 4px; padding: 3px 8px; cursor: pointer; }
      button:hover { border-color: var(--cc-border-strong); }
      button:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--cc-focus); outline-offset: 1px; }
      button.primary { background: var(--cc-accent); color: var(--cc-accent-fg); border-color: var(--cc-accent); font-weight: 600; }
      button:disabled { opacity: 0.55; cursor: default; }
      button.link { border: 0; background: none; padding: 0; color: var(--cc-accent); text-decoration: underline; }
      /* Reply (0.8.0's reply page, folded in as a side tab). Who drafted it: a framed line with a bold word, not a colour alone. */
      .marker { margin: 0 0 10px; padding: 6px 10px; border: 1px solid var(--cc-border-strong); border-left: 3px solid var(--cc-accent); border-radius: 4px; background: var(--cc-surface-1); }
      .marker strong { font-weight: 700; }
      .head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
      .field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
      .field label { font-weight: 600; }
      select { font: inherit; color: inherit; background: var(--cc-bg-menu); border: 1px solid var(--cc-border); border-radius: 4px; padding: 3px 6px; max-width: 100%; }
      textarea.reply { font: 13px/1.5 system-ui, sans-serif; color: inherit; background: var(--cc-bg-input, var(--cc-bg)); border: 1px solid var(--cc-border); border-radius: 4px; padding: 6px 8px; min-height: 160px; resize: vertical; box-sizing: border-box; width: 100%; }
      @media (pointer: coarse) { textarea.reply, select { font-size: 16px; } }
      .help { color: var(--cc-fg-muted); font-size: 12px; }
      .count.over { color: var(--cc-status-ended); font-weight: 600; }
      .line { padding: 6px 10px; border-radius: 4px; margin: 0 0 10px; white-space: pre-wrap; overflow-wrap: anywhere; border: 1px solid var(--cc-border); }
      .line.error { background: var(--cc-bg-error); }
      .line.error::before { content: "⚠ "; font-weight: 700; }
      .line.info { background: var(--cc-bg-banner, var(--cc-surface-1)); }
      ul.steps { list-style: none; margin: 0 0 10px; padding: 0; }
      ul.steps li { padding: 2px 0; }
      /* A step's outcome is a word and a mark, not only a colour. */
      ul.steps .mark { display: inline-block; width: 1.4em; font-weight: 700; }
      .actions { display: flex; justify-content: flex-end; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="main"><p class="muted">Loading…</p></div>
      <div id="side" hidden></div>
    </div>
  </body>
</html>
